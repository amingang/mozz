<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>هزینه‌های سفر</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>هزینه‌های سفر</h1>
        <p>مدیریت هزینه‌های سفر گروهی</p>
    </header>

    <nav>
        <a href="index.html">خانه</a>
        <a href="members.html">اعضای سفر</a>
        <a href="schedule.html">برنامه روزانه</a>
        <a href="supplies.html">وسایل مورد نیاز</a>
        <a href="expenses.html">هزینه‌ها</a>
        <a href="places.html">مکان‌های پیشنهادی</a>
    </nav>

    <main>

        <h2 class="title">کارت هزینه‌ها</h2>

        <!-- کارت‌های سفید هزینه‌ها توسط JS به صورت پویا اینجا ساخته می‌شوند -->
        <section class="cards" id="expenses-cards-container"></section>

        <!-- بخش ثبت و مدیریت هزینه‌ها -->
        <section class="info" style="margin-top: 35px;">
            <h2>ثبت و مدیریت هزینه‌ها</h2>

            <div style="margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px;">
                <h3 id="total-expense" style="margin: 0 0 10px 0; color: #38bdf8;">مجموع هزینه‌ها: ۰ تومان</h3>
                <p id="per-person-expense" style="margin: 0; color: #cbd5e1;">سهم متوسط هر نفر: ۰ تومان</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="exp-title" placeholder="عنوان هزینه (مثلاً بنزین)" style="padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
                <input type="number" id="exp-amount" placeholder="مبلغ (تومان)" style="padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
                <input type="text" id="exp-category" placeholder="دسته‌بندی (حمل‌ونقل، خوراکی)" style="padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
                <input type="text" id="exp-payer" placeholder="پرداخت‌کننده" style="padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
            </div>
            
            <button type="button" onclick="handleAddExpense()" style="width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px;">ثبت هزینه</button>

            <!-- لیست هزینه‌ها جهت حذف -->
            <ul id="expense-list" style="list-style: none; padding: 0;"></ul>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>هزینه‌های سفر</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>هزینه‌های سفر</h1>
        <p>مدیریت هزینه‌های سفر گروهی</p>
    </header>

    <nav>
        <a href="index.html">خانه</a>
        <a href="members.html">اعضای سفر</a>
        <a href="schedule.html">برنامه روزانه</a>
        <a href="supplies.html">وسایل مورد نیاز</a>
        <a href="expenses.html">هزینه‌ها</a>
        <a href="places.html">مکان‌های پیشنهادی</a>
    </nav>

    <main>
        <h2 class="title">کارت هزینه‌ها</h2>
        <section class="cards" id="expenses-cards-container"></section>

        <section class="info section-spaced">
            <h2>ثبت و مدیریت هزینه‌ها</h2>
            <div class="expense-summary">
                <h3 id="total-expense">مجموع هزینه‌ها: ۰ تومان</h3>
                <p id="per-person-expense">سهم متوسط هر نفر: ۰ تومان</p>
            </div>

            <div class="expense-input-grid">
                <input class="form-control" type="text" id="exp-title" placeholder="عنوان هزینه (مثلاً بنزین)">
                <input class="form-control" type="number" id="exp-amount" min="1" placeholder="مبلغ (تومان)">
                <input class="form-control" type="text" id="exp-category" placeholder="دسته‌بندی (حمل‌ونقل، خوراکی)">
                <input class="form-control" type="text" id="exp-payer" placeholder="پرداخت‌کننده">
            </div>

            <button class="primary-button primary-button-wide" type="button" data-action="add-expense">ثبت هزینه</button>
            <ul class="list-reset" id="expense-list"></ul>
        </section>
    </main>
</body>
</html>
